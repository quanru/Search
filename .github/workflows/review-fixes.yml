name: Search review fixes validation
on:
  push:
    branches: [verify/search-review-fixes-20261009]
    paths: [.github/workflows/review-fixes.yml]
permissions:
  contents: read
jobs:
  port-recovery:
    name: PR 453 · full native recovery fixture
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      SEARCH_PROBE: review-453-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: quanru/Search
          ref: 310eb71a0bdfe2e7089c388a5003209528fc24dd
          persist-credentials: false
      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = 310eb71a0bdfe2e7089c388a5003209528fc24dd
      - name: Full shim regression
        run: node Tests/ExtensionWorkerRecovery/run.js
      - name: Diagnostic helper self-checks
        run: python3 Tests/ExtensionWorkerRecovery/live.py --self-test
      - name: Release app build
        id: build
        if: always()
        run: |
          ./build.sh release
          if [ -d build/intel/Search.app ]; then
            ditto build/intel/Search.app build/Search.app
          fi
      - name: Native extension recovery fixture
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 10
        run: |
          python3 - <<'PYTHON'
          import runpy, sys, time
          from pathlib import Path
          sys.path.insert(0, 'Tests')
          import split_view as sv
          original_launch = sv.launch
          def launch_with_readiness():
              before = sv.running()
              try:
                  original_launch()
                  deadline = time.monotonic() + 60
                  while time.monotonic() < deadline:
                      owners = (sv.running() - before) & sv.holding()
                      sv.started.update(owners)
                      if Path(sv.SOCK).exists() and owners:
                          print('OWNED_BENCH_SOCKET_READY', sv.SOCK, sorted(owners), flush=True)
                          break
                      time.sleep(0.2)
                  else:
                      raise RuntimeError('Probe did not own its exact bench socket within additional60s')
              finally:
                  sv.started.update((sv.running() - before) & sv.holding())
          sv.launch = launch_with_readiness
          print('VERIFICATION ADAPTATION: original hidden launcher, up to60s additional readiness for this exact probe socket; source unchanged', flush=True)
          sys.argv = ['Tests/ExtensionWorkerRecovery/live.py']
          runpy.run_path(sys.argv[0], run_name='__main__')
          PYTHON
      - name: State verification scope
        if: always()
        run: echo "PR 453 at 310eb71a0bdfe2e7089c388a5003209528fc24dd. Exact310eb71 production and native manifest parsing already passed11 scoped Swift tests in run37909447434. This run builds Release and exercises the full native fixture using the existing hidden open launcher, avoiding measured debugger cold-start overhead with a bounded probe-socket readiness wrapper; no source or assertion changes. Same signature, entitlements, probe profile and screen guard; no host security settings changed. Only actual fixture assertions establish exercised recovery coverage; NOT COVERED remains unverified. Fixture PASS/FAIL/BLOCKED output is authoritative. PR 509 already verified at a3c4abe and not rerun." >> "$GITHUB_STEP_SUMMARY"
