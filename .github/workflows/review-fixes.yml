name: Search review fixes validation
on:
  push:
    branches: [verify/search-review-fixes-20261009]
    paths: [.github/workflows/review-fixes.yml]
permissions:
  contents: read
jobs:
  port-recovery-native:
    name: PR 453 · native admission diagnosis
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      SEARCH_PROBE: review-453-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: quanru/Search
          ref: 6065608e7e136dfd9905f4ec8d534fe074963ba6
          persist-credentials: false
      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = 6065608e7e136dfd9905f4ec8d534fe074963ba6
      - name: Release app build
        run: |
          ./build.sh release
          if [ -d build/intel/Search.app ]; then
            ditto build/intel/Search.app build/Search.app
          fi
      - name: Live native WebKit port recovery with crash diagnostics
        timeout-minutes: 10
        run: python3 Tests/ExtensionWorkerRecovery/live.py
      - name: State verification scope
        if: always()
        run: echo "PR 453 at 6065608e7e136dfd9905f4ec8d534fe074963ba6. Production tree is unchanged from 0d6fca47; this run preserves native exception diagnostics if live fixture admission fails. Prior Swift and Node passed; live PASS/FAIL/NOT COVERED output is authoritative." >> "$GITHUB_STEP_SUMMARY"
