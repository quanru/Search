name: Search review fixes validation
on:
  push:
    branches: [verify/search-review-fixes-20261009]
    paths: [.github/workflows/review-fixes.yml]
permissions:
  contents: read
jobs:
  popup-upstream-baseline:
    name: Upstream main · native link menu baseline
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      SEARCH_PROBE: review-popup-baseline-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: driceroland/Search
          ref: 35aa0516fc300031733bb843f334b47baff72232
          persist-credentials: false
      - name: Verify unmodified upstream revision
        run: test "$(git rev-parse HEAD)" = 35aa0516fc300031733bb843f334b47baff72232
      - name: Release app build
        run: |
          ./build.sh release
          if [ -d build/intel/Search.app ]; then
            ditto build/intel/Search.app build/Search.app
          fi
      - name: Existing native link menu baseline
        run: python3 Tests/link_menu.py
      - name: State verification scope
        if: always()
        run: echo "Unmodified upstream 35aa0516fc300031733bb843f334b47baff72232, same standard Intel runner and Release build. Existing native link_menu.py only; no long-menu retry and no PR source overlays." >> "$GITHUB_STEP_SUMMARY"
