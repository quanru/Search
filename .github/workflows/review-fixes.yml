name: Search review fixes validation
on:
  push:
    branches: [verify/search-review-fixes-20261009]
    paths: [.github/workflows/review-fixes.yml]
permissions:
  contents: read
jobs:
  extension-admission:
    name: ${{ matrix.label }} · extension admission and OS evidence
    runs-on: macos-15-intel
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PR 453
            repository: quanru/Search
            sha: 9df9dba0734c1afddf284e6a3e8a57d286829dd2
            args: ''
          - label: Upstream baseline
            repository: driceroland/Search
            sha: 35aa0516fc300031733bb843f334b47baff72232
            args: --admission-only
    defaults:
      run:
        working-directory: source
    env:
      SEARCH_PROBE: admission-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: quanru/Search
          ref: 9df9dba0734c1afddf284e6a3e8a57d286829dd2
          persist-credentials: false
          path: fixtures
          sparse-checkout: Tests/ExtensionWorkerRecovery
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          persist-credentials: false
          path: source
      - name: Verify source and install only fixture overlay
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p Tests/ExtensionWorkerRecovery
          cp -R ../fixtures/Tests/ExtensionWorkerRecovery/. Tests/ExtensionWorkerRecovery/
          git diff --stat
          git status --short
      - name: Diagnostic helper self-checks
        run: python3 Tests/ExtensionWorkerRecovery/live.py --self-test
      - name: Release app build
        run: |
          ./build.sh release
          if [ -d build/intel/Search.app ]; then
            ditto build/intel/Search.app build/Search.app
          fi
      - name: Bounded live native fixture with OS diagnostics
        timeout-minutes: 10
        run: python3 Tests/ExtensionWorkerRecovery/live.py ${{ matrix.args }}
      - name: State verification scope
        if: always()
        env:
          LABEL: ${{ matrix.label }}
          SOURCE: ${{ matrix.sha }}
        run: echo "$LABEL at $SOURCE with fixture 9df9dba0734c1afddf284e6a3e8a57d286829dd2. Baseline overlays test files only, never production code; admission-only does not test recovery. OS reports restricted to this launched process. No model, secrets, caches, or artifact upload." >> "$GITHUB_STEP_SUMMARY"
