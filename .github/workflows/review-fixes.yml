name: Search review fixes validation
on:
  push:
    branches: [verify/search-review-fixes-20261009]
    paths: [.github/workflows/review-fixes.yml]
permissions:
  contents: read
jobs:
  port-recovery:
    name: PR 453 · full native recovery fixture
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      SEARCH_PROBE: review-453-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: quanru/Search
          ref: c97342b404c83151834dac1932a766936a6c589e
          persist-credentials: false
      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = c97342b404c83151834dac1932a766936a6c589e
      - name: Full shim regression
        run: node Tests/ExtensionWorkerRecovery/run.js
      - name: Diagnostic helper self-checks
        run: python3 Tests/ExtensionWorkerRecovery/live.py --self-test
      - name: Scoped Swift extension regression
        run: swift test --filter 'Extension(WorkerPort|Port|WorkerLink|Scripting)Tests'
      - name: Release app build
        id: build
        if: always()
        run: |
          ./build.sh release
          if [ -d build/intel/Search.app ]; then
            ditto build/intel/Search.app build/Search.app
          fi
      - name: LLDB native extension recovery fixture
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 10
        run: python3 Tests/ExtensionWorkerRecovery/live.py --lldb-launch
      - name: State verification scope
        if: always()
        run: echo "PR 453 at c97342b404c83151834dac1932a766936a6c589e. Full-shim mocks, scoped Swift tests, Release build, and full LLDB-launched native recovery fixture after repairing the benchmark error formatter and awaiting extension startup. Same signature, entitlements, probe profile and screen guard; no host security settings changed. Only actual fixture assertions establish exercised recovery coverage; NOT COVERED remains unverified. Fixture PASS/FAIL/BLOCKED output is authoritative. PR 509 already verified at a3c4abe and not rerun." >> "$GITHUB_STEP_SUMMARY"
