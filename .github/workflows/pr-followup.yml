name: Search PR follow-up validation
on:
  push:
    branches: [verify/search-pr-followup-20261012]
permissions:
  contents: read
jobs:
  validate:
    name: PR ${{ matrix.pr }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - pr: '415'
            sha: 8877bf8f6e698711a8de153581b3a9a058c60027
            filter: BrowserDiscoveryTests|BrowserImportBoundaryTests|ImportFileTests
    steps:
      - uses: actions/checkout@v4
        with:
          repository: quanru/Search
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Scoped Swift regression
        env:
          TEST_FILTER: ${{ matrix.filter }}
        run: |
          set -o pipefail
          swift test --jobs 2 --filter "$TEST_FILTER" 2>&1 | tee swift-tests.log
      - name: Release build
        run: |
          set -o pipefail
          swift build -c release --jobs 2 -Xswiftc -Osize 2>&1 | tee release-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-${{ matrix.pr }}-${{ matrix.sha }}
          path: |
            swift-tests.log
            release-build.log
          retention-days: 14
      - name: Record validation scope
        if: always()
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          echo "PR $PR_NUMBER, exact revision $EXPECTED_SHA. Scoped Swift tests and Release build on hosted Intel macOS. No model calls or real-profile data. Native TCC/picker and visual checks are not included." >> "$GITHUB_STEP_SUMMARY"
