name: Search content-message overlap validation
on:
  push:
    branches: [verify/search-content-overlap-20261012]
    paths: [.github/workflows/content-overlap.yml]
permissions:
  contents: read
jobs:
  port-recovery:
    name: PR 453 · independent content-message overlap
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      SEARCH_PROBE: review-453-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: quanru/Search
          ref: 7ad610d9802e72bef1dc99507d674a54d8102ae0
          persist-credentials: false
      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = 7ad610d9802e72bef1dc99507d674a54d8102ae0
      - uses: actions/checkout@v4
        with:
          repository: quanru/Search
          ref: ${{ github.sha }}
          path: fixture-overlay
          persist-credentials: false
      - name: Overlay independent content-message fixtures
        run: |
          for file in live.py site.html cross-origin.html cross-origin-checks.js fixture-checks.js extension/content.js; do
            cp "fixture-overlay/Tests/ExtensionWorkerRecovery/$file" "Tests/ExtensionWorkerRecovery/$file"
          done
          git diff --quiet -- Sources
          echo "PRODUCT_SHA=$(git rev-parse HEAD), FIXTURE_SHA=${{ github.sha }}"
      - name: Cross-origin observation bridge checks
        run: node Tests/ExtensionWorkerRecovery/cross-origin-checks.js
      - name: Full shim regression
        run: node Tests/ExtensionWorkerRecovery/run.js
      - name: Fixture lifecycle checks
        run: node Tests/ExtensionWorkerRecovery/fixture-checks.js
      - name: Diagnostic helper self-checks
        run: python3 Tests/ExtensionWorkerRecovery/live.py --self-test
      - name: Release app build
        id: build
        if: always()
        run: |
          ./build.sh release
          if [ -d build/intel/Search.app ]; then
            ditto build/intel/Search.app build/Search.app
          fi
      - name: Native extension recovery fixture
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 10
        run: |
          python3 - <<'PYTHON'
          import runpy, sys, time
          from pathlib import Path
          sys.path.insert(0, 'Tests')
          import split_view as sv
          original_launch = sv.launch
          def launch_with_readiness():
              before = sv.running()
              try:
                  original_launch()
                  deadline = time.monotonic() + 60
                  while time.monotonic() < deadline:
                      owners = (sv.running() - before) & sv.holding()
                      sv.started.update(owners)
                      if Path(sv.SOCK).exists() and owners:
                          print('OWNED_BENCH_SOCKET_READY', sv.SOCK, sorted(owners), flush=True)
                          break
                      time.sleep(0.2)
                  else:
                      raise RuntimeError('Probe did not own its exact bench socket within an additional 60s')
              finally:
                  sv.started.update((sv.running() - before) & sv.holding())
          sv.launch = launch_with_readiness
          print('VERIFICATION ADAPTATION: original hidden launcher, up to 60s additional readiness for this exact probe socket; source unchanged', flush=True)
          sys.argv = ['Tests/ExtensionWorkerRecovery/live.py']
          runpy.run_path(sys.argv[0], run_name='__main__')
          PYTHON
      - name: State verification scope
        if: always()
        run: |
          echo "Product 7ad610d9802e72bef1dc99507d674a54d8102ae0. Fixture overlay ${{ github.sha }}. Parent localhost and child 127.0.0.1 have different origins; admission requires a null cross-origin contentDocument and real child audit. Sources, worker and extension-page scripts are unchanged; the fixture content script schedules a bounded ordinary runtime message and records its actual invocation time. Retained port identity, once-only disconnects and fresh echoes are checked through revives, cooldown and idle/wake. Actual content-message overlap and deferred reply are mandatory assertions. Extension-page health-check overlap, dead workers and delayed cold startup remain uncovered. Original hidden probe and owned cleanup are preserved." >> "$GITHUB_STEP_SUMMARY"
