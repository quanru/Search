name: Search PR readiness
on:
  push:
    branches: [chore/search-pr-validation-20261004]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    name: PR ${{ matrix.pr }} · Mac validation
    runs-on: macos-15-intel
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: [{"pr": "main-release", "sha": "cddb9cdd19e64321c95d5e733217799908ad3b52", "mode": "release"}, {"pr": "main-debug", "sha": "cddb9cdd19e64321c95d5e733217799908ad3b52", "mode": "debug"}, {"pr": 509, "sha": "23710da6c7e98d855ced671ede87c622863b28f4", "mode": "release"}]
    env:
      SEARCH_PROBE: pr-${{ matrix.pr }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: quanru/Search
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify exact PR revision
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/pr-validation"
      - name: Swift unit regression
        run: |
          set -o pipefail
          # The existing WebKit download journeys require the separate
          # download-fixture repair; these PRs do not alter downloads.
          swift test --skip DownloadLifecycleTests 2>&1 | tee "$RUNNER_TEMP/pr-validation/swift.log"
      - name: Release build
        if: always()
        run: |
          set -o pipefail
          ./build.sh "${{ matrix.mode }}" 2>&1 | tee "$RUNNER_TEMP/pr-validation/release.log"
          # The existing hidden harness expects the Apple silicon bundle path.
          if [ -d build/intel/Search.app ]; then
            ditto build/intel/Search.app build/Search.app
          fi
      - name: Split View regression
        if: always()
        run: |
          set -o pipefail
          python3 Tests/split_view.py 2>&1 | tee "$RUNNER_TEMP/pr-validation/split-view.log"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-pr-${{ matrix.pr }}-validation
          path: ${{ runner.temp }}/pr-validation/
          retention-days: 14
      - name: Validation scope
        if: always()
        env:
          PR: ${{ matrix.pr }}
          REVISION: ${{ matrix.sha }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Search PR #$PR

          Revision: \`$REVISION\`

          Validation: Swift unit regression (excluding the existing DownloadLifecycleTests harness), hidden Split View model regression, and ${{ matrix.mode }} app build.

          This job does not run visual E2E or verify modified mouse drags or live extension lifecycle recovery. Download harness validation is tracked separately: https://github.com/quanru/Search/actions/runs/36993014218
          EOF
