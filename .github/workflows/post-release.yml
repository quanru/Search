name: Search post-release PR validation
on:
  push:
    branches: [verify/search-post-release-20261015]
permissions:
  contents: read
jobs:
  validate:
    name: PR ${{ matrix.pr }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - pr: '453'
            sha: b08f515faea63c343a49b3892853db2eb0833ed1
            filter: ExtensionWorkerPortTests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/checkout@v4
        with:
          path: observer
          sparse-checkout: .github/diagnostics
          persist-credentials: false
      - name: Scoped Swift regression
        env:
          TEST_FILTER: ${{ matrix.filter }}
        run: |
          set -o pipefail
          swift test --filter "$TEST_FILTER" 2>&1 | tee swift-tests.log
      - name: Shim and fixture checks
        if: matrix.pr == '453'
        run: |
          node Tests/ExtensionWorkerRecovery/run.js
          node Tests/ExtensionWorkerRecovery/fixture-checks.js
          node Tests/ExtensionWorkerRecovery/cross-origin-checks.js
          python3 Tests/ExtensionWorkerRecovery/live.py --self-test
      - name: Popup relay script regression
        if: matrix.pr == '509'
        run: node Tests/popup_gesture_script.js
      - name: Release build
        run: |
          set -o pipefail
          ./build.sh release 2>&1 | tee release-build.log
          ditto build/intel/Search.app build/Search.app
      - name: Native recovery acceptance
        if: matrix.pr == '453'
        run: |
          set -o pipefail
          python3 observer/.github/diagnostics/recovery-launch.py 2>&1 | tee recovery.log
      - name: Native layout and drawings
        if: startsWith(matrix.pr, '468')
        run: |
          set -o pipefail
          python3 observer/.github/diagnostics/page-size-probe.py 2>&1 | tee layout.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-${{ matrix.pr }}-${{ matrix.sha }}
          path: |
            swift-tests.log
            release-build.log
            recovery.log
            layout.log
            page-size-results.json
            layout-evidence
          retention-days: 14
      - name: Record scope
        if: always()
        env:
          PR_NUMBER: ${{ matrix.pr }}
          EXPECTED_SHA: ${{ matrix.sha }}
        run: echo "PR $PR_NUMBER at $EXPECTED_SHA, post-1.0.5 integration. Scoped Swift regression and Release build. Recovery runs only for 453, layout drawings only for 468 and its upstream baseline. No model calls or real profiles. Native drag, long-lived sign-in menus, original clipping, cold-start and dead-worker acceptance are not implied by this job." >> "$GITHUB_STEP_SUMMARY"
