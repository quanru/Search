name: Recover Midscene reports
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Run ID containing the original Midscene shard artifacts'
        required: true
        type: string
  push:
    paths: ['.github/workflows/midscene-reports.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: midscene-pages
  cancel-in-progress: false
jobs:
  recover:
    if: >-
      (inputs.source_run != '' || vars.MIDSCENE_REPORT_SOURCE_RUN != '') &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       github.ref == vars.MIDSCENE_TRUSTED_REF)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: Tests/Midscene
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: midscene-import
          path: Tests/Midscene/midscene_run/midscene-import
          run-id: ${{ inputs.source_run || vars.MIDSCENE_REPORT_SOURCE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: midscene-navigation
          path: Tests/Midscene/midscene_run/midscene-navigation
          run-id: ${{ inputs.source_run || vars.MIDSCENE_REPORT_SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Merge native reports and write Summary
        id: merge
        continue-on-error: true
        working-directory: Tests/Midscene
        env:
          MIDSCENE_REPORT_URL: ${{ format('{0}/runs/{1}/{2}', vars.MIDSCENE_PAGES_URL, github.run_id, github.run_attempt) }}
          SOURCE_RUN: ${{ inputs.source_run || vars.MIDSCENE_REPORT_SOURCE_RUN }}
        run: |
          printf 'Source workflow: [run %s](https://github.com/quanru/Search/actions/runs/%s/attempts/1)\n\n' "$SOURCE_RUN" "$SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"
          npm run report
      - name: Preserve all available reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midscene-recovered
          path: Tests/Midscene/midscene_run/
          retention-days: 14
      - name: Prepare Pages site
        if: always() && vars.MIDSCENE_PAGES_URL != ''
        env:
          REPORT_PATH: runs/${{ github.run_id }}/${{ github.run_attempt }}
        run: |
          mkdir -p "_site/$REPORT_PATH"
          cp -R Tests/Midscene/midscene_run/. "_site/$REPORT_PATH/"
      - uses: actions/upload-pages-artifact@v3
        if: always() && vars.MIDSCENE_PAGES_URL != ''
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
        if: always() && vars.MIDSCENE_PAGES_URL != ''
      - name: Keep original failures visible
        if: steps.merge.outcome != 'success'
        run: exit 1
